<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service — Agence Golden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260812">
<style>
  .svc-wrap{max-width:760px;margin:0 auto;padding:44px 24px 90px;}
  .svc-gallery{display:flex;gap:8px;overflow-x:auto;border-radius:10px;margin-bottom:24px;-webkit-overflow-scrolling:touch;}
  .svc-gallery img,.svc-gallery video{width:100%;max-width:760px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;flex:0 0 100%;scroll-snap-align:start;}
  .svc-gallery{scroll-snap-type:x mandatory;}
  .svc-gallery.empty{aspect-ratio:4/3;background:var(--stone-line);display:flex;align-items:center;justify-content:center;color:var(--text-mute);font-size:14px;}
  .svc-zone-tag{color:var(--gold);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
  .svc-wrap h1{font-size:26px;font-weight:600;margin:8px 0 14px;}
  .svc-price{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:20px;}
  .svc-desc{font-size:15px;color:var(--text-dark);line-height:1.7;margin-bottom:26px;white-space:pre-line;}
  .svc-box{background:#fff;border:1px solid var(--stone-line);border-radius:10px;padding:22px;margin-bottom:24px;}
  .svc-box h2{font-size:15px;margin-bottom:10px;}
  .svc-box p{font-size:14px;color:var(--text-mute);white-space:pre-line;line-height:1.6;}
  .svc-related h2{font-size:18px;margin:36px 0 4px;}
  .svc-related > p{color:var(--text-mute);font-size:13.5px;margin-bottom:6px;}
  .svc-not-found{text-align:center;padding:80px 24px;color:var(--text-mute);}
  .svc-contact-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .svc-contact-row a{flex:1;min-width:150px;text-align:center;padding:12px 14px;border-radius:8px;font-size:13.5px;font-weight:600;text-decoration:none;}
  .svc-contact-row .whatsapp-btn{background:#25D366;color:#fff;}
  .svc-contact-row .seller-btn{background:#fff;border:1px solid var(--stone-line);color:var(--ink);}
</style>
</head>
<body>

  <div id="site-header"></div>

  <div class="svc-wrap" id="svc-content" style="display:none;">
    <div class="svc-zone-tag" id="svc-zone"></div>
    <h1 id="svc-name"></h1>

    <div class="svc-gallery" id="svc-gallery"></div>

    <div class="svc-price" id="svc-price"></div>
    <div class="svc-desc" id="svc-desc"></div>

    <div class="svc-box" id="svc-conditions-box" style="display:none;">
      <h2>Conditions d'utilisation</h2>
      <p id="svc-conditions"></p>
    </div>

    <div class="svc-contact-row" id="svc-contact-row"></div>

    <a class="btn btn-onlight" id="svc-order-btn" href="#">Acheter maintenant</a>

    <div class="svc-related">
      <h2>Autres réalisations de cette zone</h2>
      <p>Un aperçu de ce que nous avons déjà réalisé.</p>
      <div class="marquee" style="border-radius:10px;">
        <div class="marquee-track" id="svc-related-track"></div>
      </div>
      <div class="realisations-grid" id="svc-related-list"></div>
    </div>
  </div>

  <div class="svc-not-found" id="svc-not-found" style="display:none;">
    <h1>Service introuvable</h1>
    <p>Ce service n'existe plus ou le lien est incorrect.</p>
  </div>

  <div id="site-footer"></div>

  <script src="translations.js?v=20260809"></script>
  <script src="script.js?v=20260812"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function(){
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (!id){
        document.getElementById("svc-not-found").style.display = "block";
        return;
      }

      supaRequest("services_golden?id=eq." + id + "&select=*").then(function(rows){
        if (!rows || rows.length === 0){
          document.getElementById("svc-not-found").style.display = "block";
          return;
        }
        const d = rows[0];
        document.title = d.name + " — Agence Golden";
        document.getElementById("svc-zone").textContent = d.zone;
        document.getElementById("svc-name").textContent = d.name;
        document.getElementById("svc-price").textContent = d.price || "";
        document.getElementById("svc-desc").textContent = d.description || "";

        const gallery = document.getElementById("svc-gallery");
        if (d.images && d.images.length){
          gallery.innerHTML = d.images.map(function(url){
            return isVideoUrl(url)
              ? '<video src="' + url + '" controls playsinline preload="metadata"></video>'
              : '<img src="' + url + '" alt="' + esc(d.name) + '">';
          }).join("");
        } else {
          gallery.classList.add("empty");
          gallery.textContent = "Aucune photo pour ce service.";
        }

        if (d.conditions){
          document.getElementById("svc-conditions").textContent = d.conditions;
          document.getElementById("svc-conditions-box").style.display = "block";
        }

        const contactRow = document.getElementById("svc-contact-row");
        let contactHtml = "";
        if (d.contact_phone){
          const waNumber = d.contact_phone.replace(/[^0-9]/g, "");
          contactHtml += '<a class="whatsapp-btn" href="https://wa.me/' + waNumber + '?text=' + encodeURIComponent("Bonjour, je suis intéressé(e) par : " + d.name) + '" target="_blank" rel="noopener">💬 WhatsApp</a>';
        }
        if (d.seller_link){
          contactHtml += '<a class="seller-btn" href="' + esc(d.seller_link) + '" target="_blank" rel="noopener">🔗 Voir le lien direct</a>';
        }
        contactRow.innerHTML = contactHtml;

        const orderUrl = "commande.html?service=" + encodeURIComponent(d.id) +
          "&name=" + encodeURIComponent(d.name) +
          "&price=" + encodeURIComponent(d.price || "");
        document.getElementById("svc-order-btn").href = orderUrl;

        document.getElementById("svc-content").style.display = "block";

        loadRealisationsMarquee(d.zone, "svc-related-track");
        loadRealisationsList(d.zone, "svc-related-list");
      }).catch(function(err){
        console.error(err);
        document.getElementById("svc-not-found").style.display = "block";
      });
    });
  </script>

</body>
</html>
