<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — Agence Golden</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260809">
<style>
  .admin-wrap{max-width:560px;margin:0 auto;padding:70px 24px 100px;}
  .admin-lock{text-align:center;padding-top:40px;}
  .admin-lock input{width:100%;max-width:280px;padding:12px;border:1px solid var(--stone-line);border-radius:6px;margin:8px 0;font-size:15px;}
  #admin-panel{display:none;}
  .admin-wrap h1{font-size:24px;text-align:center;margin-bottom:30px;}
  .admin-box{background:#fff;border:1px solid var(--stone-line);border-radius:10px;padding:22px;margin-bottom:24px;}
  .admin-box label{display:block;font-size:12.5px;font-weight:600;color:var(--text-mute);margin:12px 0 6px;}
  .admin-box input,.admin-box select,.admin-box textarea{width:100%;border:1px solid var(--stone-line);border-radius:6px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;}
  .admin-box textarea{min-height:70px;resize:vertical;}
  .upload-status{font-size:12.5px;color:var(--gold);margin-top:10px;display:none;}
  .admin-list-item{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--stone-line);padding:10px 0;}
  .admin-list-item img{width:52px;height:52px;object-fit:cover;border-radius:6px;flex:0 0 auto;}
  .admin-list-item .info{flex:1;font-size:12.5px;}
  .admin-list-item .info b{display:block;font-size:13.5px;color:var(--ink);}
  .admin-list-item button{background:none;border:1px solid #c85a5a;color:#c85a5a;border-radius:4px;padding:5px 10px;font-size:11px;cursor:pointer;}
  #auth-error{color:#c85a5a;font-size:13px;display:none;margin-top:8px;}
  #btn-signin:disabled{opacity:.5;}
  .logout-link{display:block;text-align:right;font-size:12px;color:var(--text-mute);margin-bottom:16px;cursor:pointer;}
</style>
</head>
<body>

  <div id="site-header"></div>

  <div class="admin-wrap">

    <div class="admin-lock" id="auth-card">
      <h1>🔒 Espace administrateur</h1>
      <p style="color:var(--text-mute);font-size:14px;">Connecte-toi avec ton compte admin pour publier une réalisation.</p>
      <input type="email" id="admin-email" placeholder="E-mail">
      <br>
      <input type="password" id="admin-pass" placeholder="Mot de passe">
      <br>
      <button class="btn btn-onlight" id="btn-signin" onclick="adminSignIn()">Se connecter</button>
      <p id="auth-error"></p>
    </div>

    <div id="admin-panel">
      <div class="logout-link" onclick="adminSignOut()">Se déconnecter</div>
      <h1>Publier une réalisation</h1>

      <div class="admin-box">
        <label>Zone concernée</label>
        <select id="ad-zone">
          <option value="ZONE A">Événementiel (ZONE A)</option>
          <option value="ZONE B">Promotion Commerciale (ZONE B)</option>
          <option value="ZONE C">Média &amp; Digital (ZONE C)</option>
          <option value="ZONE D">Services Techniques (ZONE D)</option>
        </select>

        <label>Titre</label>
        <input type="text" id="ad-title" placeholder="Ex : Mariage Kavumu - Juin 2026">

        <label>Description</label>
        <textarea id="ad-desc" placeholder="Décrivez la réalisation, le client, le contexte..."></textarea>

        <label>Lien (site du partenaire, page Facebook, etc. — optionnel)</label>
        <input type="url" id="ad-link" placeholder="https://...">

        <label>Photo ou vidéo (depuis votre téléphone) — laissez vide si vous mettez un lien YouTube ci-dessous</label>
        <input type="file" id="ad-file" accept="image/*,video/*">

        <label>Vidéo YouTube (optionnel — collez le lien après l'avoir mise en ligne sur votre chaîne)</label>
        <input type="url" id="ad-video" placeholder="https://youtube.com/watch?v=...">

        <button class="btn btn-onlight" id="btn-publish" style="margin-top:16px;" onclick="publishRealisation()">Publier</button>
        <p class="upload-status" id="upload-status"></p>
      </div>

      <div class="admin-box">
        <h2 style="font-size:15px;margin-bottom:10px;">🎙️ Publier un podcast (Média &amp; Digital uniquement)</h2>
        <label>Titre de l'épisode</label>
        <input type="text" id="pc-title" placeholder="Ex : Épisode 1 — Comment lancer son business">

        <label>Description</label>
        <textarea id="pc-desc" placeholder="Résumé de l'épisode..."></textarea>

        <label>Lien de l'épisode (Spotify, YouTube, SoundCloud...)</label>
        <input type="url" id="pc-link" placeholder="https://open.spotify.com/episode/...">

        <label>Ou fichier audio (MP3, depuis votre téléphone)</label>
        <input type="file" id="pc-audio" accept="audio/*">

        <button class="btn btn-onlight" id="btn-publish-podcast" style="margin-top:16px;" onclick="publishPodcast()">Publier le podcast</button>
        <p class="upload-status" id="podcast-status"></p>
      </div>

      <div class="admin-box">
        <h2 style="font-size:15px;margin-bottom:10px;">Podcasts publiés</h2>
        <div id="podcast-admin-list"></div>
      </div>

      <div class="admin-box">
        <h2 style="font-size:15px;margin-bottom:10px;">Réalisations publiées</h2>
        <div id="admin-list"></div>
      </div>
    </div>

  </div>

  <div id="site-footer"></div>

  <script src="translations.js?v=20260809"></script>
  <script src="script.js?v=20260812"></script>
  <script>
    // ===============================
    // AUTH ADMIN (Supabase)
    // ===============================
    function adminSignIn(){
      const email = document.getElementById("admin-email").value.trim();
      const pass = document.getElementById("admin-pass").value;
      const err = document.getElementById("auth-error");
      err.style.display = "none";

      if (!email || !pass){
        err.textContent = "E-mail et mot de passe requis.";
        err.style.display = "block";
        return;
      }

      document.getElementById("btn-signin").disabled = true;
      supaSignIn(email, pass).then(function(){
        showAdminPanel();
      }).catch(function(e){
        err.textContent = "Connexion refusée : " + e.message;
        err.style.display = "block";
        document.getElementById("btn-signin").disabled = false;
      });
    }

    function adminSignOut(){
      supaSignOut();
      document.getElementById("auth-card").style.display = "block";
      document.getElementById("admin-panel").style.display = "none";
      document.getElementById("btn-signin").disabled = false;
    }

    function showAdminPanel(){
      document.getElementById("auth-card").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      loadAdminList();
      loadPodcastAdminList();
    }

    // Si déjà connecté (session en cours dans cet onglet), afficher direct le panel
    if (isSupaLoggedIn()) showAdminPanel();

    function showStatus(text, isError){
      const status = document.getElementById("upload-status");
      status.style.display = "block";
      status.style.color = isError ? "#c85a5a" : "var(--gold)";
      status.textContent = text;
    }
    function clearStatus(){
      const status = document.getElementById("upload-status");
      status.style.display = "none";
    }

    // extractYouTubeId() est définie dans script.js (partagée)

    // ===============================
    // PUBLIER UNE RÉALISATION
    // ===============================
    function publishRealisation(){
      const btn = document.getElementById("btn-publish");
      btn.disabled = true;

      const zone = document.getElementById("ad-zone").value;
      const title = document.getElementById("ad-title").value.trim();
      const description = document.getElementById("ad-desc").value.trim();
      const link = document.getElementById("ad-link").value.trim();
      const fileInput = document.getElementById("ad-file");
      const file = fileInput.files[0];
      const videoUrl = document.getElementById("ad-video").value.trim();
      const youtubeId = extractYouTubeId(videoUrl);

      if (!title || (!file && !youtubeId)){
        alert("Ajoute un titre, et soit une photo, soit un lien YouTube valide.");
        btn.disabled = false;
        return;
      }

      showStatus("Préparation...");

      // Cas 1 : vidéo YouTube
      if (youtubeId){
        showStatus("Publication de la vidéo...");
        supaRequest("realisations_golden", {
          method: "POST",
          body: {
            zone: zone, title: title, description: description, link: link,
            image_url: "https://img.youtube.com/vi/" + youtubeId + "/hqdefault.jpg",
            video_id: youtubeId,
            media_type: "youtube"
          }
        }).then(finishPublish).catch(function(err){
          showStatus("❌ " + err.message, true);
          btn.disabled = false;
        });
        return;
      }

      // Cas 2 : fichier (photo ou vidéo) → Supabase Storage
      const maxSize = 50 * 1024 * 1024;
      const isImage = file.type.startsWith("image/");
      const isVideo = file.type.startsWith("video/");
      if (!isImage && !isVideo){
        showStatus("❌ Le fichier doit être une image ou une vidéo.", true);
        btn.disabled = false;
        return;
      }
      if (file.size > maxSize){
        showStatus("❌ Fichier trop lourd (max 50 Mo).", true);
        btn.disabled = false;
        return;
      }

      showStatus("Envoi du fichier en cours...");

      uploadToSupabase(file, "realisations")
        .then(function(url){
          showStatus("Fichier envoyé ✓ — enregistrement en cours...");
          return supaRequest("realisations_golden", {
            method: "POST",
            body: {
              zone: zone, title: title, description: description, link: link,
              image_url: url,
              media_type: isVideo ? "video" : "image",
              video_id: null
            }
          });
        })
        .then(finishPublish)
        .catch(function(err){
          showStatus("❌ " + err.message, true);
          btn.disabled = false;
        });
    }

    function finishPublish(){
      showStatus("✅ Publié avec succès !");
      document.getElementById("ad-title").value = "";
      document.getElementById("ad-desc").value = "";
      document.getElementById("ad-link").value = "";
      document.getElementById("ad-video").value = "";
      document.getElementById("ad-file").value = "";
      document.getElementById("btn-publish").disabled = false;
      loadAdminList();
      setTimeout(clearStatus, 2500);
    }

    // ===============================
    // PODCASTS
    // ===============================
    function publishPodcast(){
      const btn = document.getElementById("btn-publish-podcast");
      const title = document.getElementById("pc-title").value.trim();
      const description = document.getElementById("pc-desc").value.trim();
      const link = document.getElementById("pc-link").value.trim();
      const audioFile = document.getElementById("pc-audio").files[0];
      const status = document.getElementById("podcast-status");

      if (!title || (!link && !audioFile)){
        alert("Ajoute au moins un titre, et soit un lien, soit un fichier audio.");
        return;
      }

      btn.disabled = true;
      status.style.display = "block";
      status.style.color = "var(--gold)";

      function savePodcast(audioUrl){
        return supaRequest("podcasts_golden", {
          method: "POST",
          body: {
            title: title,
            description: description,
            link: link || null,
            audio_url: audioUrl || null
          }
        });
      }

      let uploadPromise;
      if (audioFile){
        status.textContent = "Envoi du fichier audio en cours...";
        uploadPromise = uploadToSupabase(audioFile, "podcasts").then(savePodcast);
      } else {
        status.textContent = "Publication en cours...";
        uploadPromise = savePodcast(null);
      }

      uploadPromise.then(function(){
        status.textContent = "✅ Podcast publié !";
        document.getElementById("pc-title").value = "";
        document.getElementById("pc-desc").value = "";
        document.getElementById("pc-link").value = "";
        document.getElementById("pc-audio").value = "";
        btn.disabled = false;
        loadPodcastAdminList();
        setTimeout(function(){ status.style.display = "none"; }, 2500);
      }).catch(function(err){
        status.style.color = "#c85a5a";
        status.textContent = "❌ " + err.message;
        btn.disabled = false;
      });
    }

    function loadPodcastAdminList(){
      const list = document.getElementById("podcast-admin-list");
      supaRequest("podcasts_golden?order=created_at.desc").then(function(rows){
        if (!rows || rows.length === 0){
          list.innerHTML = '<p style="font-size:13px;color:var(--text-mute);">Aucun podcast publié pour le moment.</p>';
          return;
        }
        list.innerHTML = "";
        rows.forEach(function(d){
          const item = document.createElement("div");
          item.className = "admin-list-item";
          item.innerHTML = '<div class="info"><b>' + esc(d.title) + '</b>' + esc(d.link || "") + '</div>';
          const btn = document.createElement("button");
          btn.textContent = "Supprimer";
          btn.onclick = function(){ deletePodcast(d.id); };
          item.appendChild(btn);
          list.appendChild(item);
        });
      }).catch(function(err){ console.error(err); });
    }

    function deletePodcast(id){
      if (!confirm("Supprimer ce podcast ?")) return;
      supaRequest("podcasts_golden?id=eq." + id, { method: "DELETE" })
        .then(loadPodcastAdminList)
        .catch(function(err){ alert("Suppression impossible : " + err.message); });
    }

    // ===============================
    // LISTE + SUPPRESSION (réalisations)
    // ===============================
    function loadAdminList(){
      const list = document.getElementById("admin-list");
      supaRequest("realisations_golden?order=created_at.desc").then(function(rows){
        if (!rows || rows.length === 0){
          list.innerHTML = '<p style="font-size:13px;color:var(--text-mute);">Aucune réalisation publiée pour le moment.</p>';
          return;
        }
        list.innerHTML = "";
        rows.forEach(function(d){
          const item = document.createElement("div");
          item.className = "admin-list-item";
          item.innerHTML =
            '<img src="' + d.image_url + '">' +
            '<div class="info"><b>' + esc(d.title) + '</b>' + esc(d.zone) + '</div>';
          const btn = document.createElement("button");
          btn.textContent = "Supprimer";
          btn.onclick = function(){ deleteRealisation(d.id); };
          item.appendChild(btn);
          list.appendChild(item);
        });
      }).catch(function(err){ console.error(err); });
    }

    function deleteRealisation(id){
      if (!confirm("Supprimer cette réalisation ?")) return;
      supaRequest("realisations_golden?id=eq." + id, { method: "DELETE" })
        .then(loadAdminList)
        .catch(function(err){ alert("Suppression impossible : " + err.message); });
    }
  </script>

</body>
</html>
