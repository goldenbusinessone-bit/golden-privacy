<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique — Agence Golden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260822f">
<style>
  .shop-header{background:var(--ink);padding:24px 20px 20px;text-align:center;}
  .shop-header h1{color:#fff;font-size:20px;font-weight:600;margin-bottom:4px;}
  .shop-header p{color:#c9c4b6;font-size:13px;}
  .shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:18px 16px 40px;max-width:900px;margin:0 auto;}
  @media (min-width:640px){.shop-grid{grid-template-columns:repeat(3,1fr);}}
  @media (min-width:960px){.shop-grid{grid-template-columns:repeat(4,1fr);}}
  .product-card{background:#fff;border:1px solid var(--stone-line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;position:relative;}
  .product-card .thumb{position:relative;aspect-ratio:1/1;background:var(--stone-line);}
  .product-card .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .product-discount{position:absolute;top:6px;left:6px;background:#d0453b;color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;}
  .product-info{padding:9px 10px 11px;flex:1;display:flex;flex-direction:column;}
  .product-name{font-size:12.5px;color:var(--ink);line-height:1.35;margin-bottom:4px;flex:1;font-weight:600;}
  .product-card-desc{font-size:11px;color:var(--text-mute);line-height:1.35;margin-bottom:6px;}
  .product-boutique-badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--gold);text-decoration:none;font-weight:600;margin-bottom:5px;}
  .product-boutique-badge:before{content:"🏬 ";}
  .product-boutique-badge svg{flex-shrink:0;}
  .product-price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;}
  .product-price{font-size:15px;font-weight:700;color:var(--ink);}
  .product-price-old{font-size:11.5px;color:var(--text-mute);text-decoration:line-through;}
  .add-cart-btn{background:var(--ink);color:#fff;border:none;border-radius:6px;padding:7px 0;font-size:12px;font-weight:600;cursor:pointer;width:100%;}
  .add-cart-btn.added{background:var(--gold);color:var(--ink);}
  .wishlist-heart{position:absolute;top:6px;right:6px;width:28px;height:28px;background:rgba(255,255,255,.9);border:none;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .wishlist-heart.active{background:var(--gold);}
  .shop-empty{grid-column:1/-1;text-align:center;color:var(--text-mute);padding:60px 20px;}

  /* ---------- Widget promo "Créer ma boutique" ---------- */
  .shop-promo{
    position:relative;overflow:hidden;margin:16px;border-radius:16px;
    background:linear-gradient(120deg,#ff6a3d,#ffb347,#ff5f9e,#ff6a3d);
    background-size:300% 300%;animation:shopPromoShift 8s ease infinite;
    padding:22px 20px;max-width:900px;margin-left:auto;margin-right:auto;
    box-shadow:0 10px 28px rgba(255,106,61,.3);
  }
  @keyframes shopPromoShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  .shop-promo::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 2px,transparent 2px 14px);
    animation:shopPromoSheen 6s linear infinite;pointer-events:none;
  }
  @keyframes shopPromoSheen{0%{transform:translateX(-20%);}100%{transform:translateX(20%);}}
  .shop-promo-inner{position:relative;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .shop-promo-icon{
    flex-shrink:0;width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;font-size:24px;
    animation:shopPromoBounce 2.2s ease-in-out infinite;
  }
  @keyframes shopPromoBounce{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-6px) rotate(4deg);}}
  .shop-promo-text{flex:1;min-width:180px;}
  .shop-promo-text .tag{display:inline-block;background:rgba(255,255,255,.25);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:6px;}
  .shop-promo-text h2{color:#fff;font-size:16px;font-weight:700;margin:0 0 3px;font-family:'Fraunces',serif;}
  .shop-promo-text p{color:rgba(255,255,255,.92);font-size:12px;margin:0;}
  .shop-promo-btn{
    flex-shrink:0;background:#fff;color:#ff5f2e;text-decoration:none;font-weight:800;
    padding:11px 20px;border-radius:999px;font-size:13px;white-space:nowrap;
    box-shadow:0 6px 14px rgba(0,0,0,.18);animation:shopPromoPulse 2.2s ease-in-out infinite;
  }
  @keyframes shopPromoPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}
</style>
</head>
<body>

  <div id="site-header"></div>

  <div class="shop-header">
    <h1>🛍️ Boutique Golden</h1>
    <p>Une sélection d'articles disponibles à la commande directe.</p>
  </div>

  <div class="shop-promo" id="shop-promo">
    <div class="shop-promo-inner">
      <div class="shop-promo-icon">🏪</div>
      <div class="shop-promo-text">
        <span class="tag">Nouveau</span>
        <h2 id="shop-promo-title">Lance ta propre boutique sur Golden</h2>
        <p id="shop-promo-sub">Vends tes produits à toute la communauté Golden — ta boutique, tes règles.</p>
      </div>
      <a href="devenir-partenaire.html" id="shop-promo-btn" class="shop-promo-btn">Créer ma boutique →</a>
    </div>
  </div>

  <div class="shop-grid" id="shop-grid">
    <p class="shop-empty">Chargement des produits...</p>
  </div>

  <div id="site-footer"></div>

  <script src="translations.js?v=20260809"></script>
  <script src="script.js?v=20260913c"></script>
  <script>
    const GOLDEN_VERIFIED_BADGE_SVG = '<svg width="11" height="11" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">' +
      '<path fill="#2a5cb8" d="M11 0l2.1 2.3 3-.7 1.1 2.9 2.9 1.1-.7 3L21.6 11l-2.2 2.4.7 3-2.9 1.1-1.1 2.9-3-.7L11 22l-2.1-2.3-3 .7-1.1-2.9-2.9-1.1.7-3L.4 11l2.2-2.4-.7-3 2.9-1.1L5.9 1.6l3 .7z"/>' +
      '<path fill="#fff" d="M9.3 15.4l-3.6-3.6 1.3-1.3 2.3 2.3 5.3-5.3 1.3 1.3z"/>' +
      '</svg>';
    let verifiedShopNames = [];

    document.addEventListener("DOMContentLoaded", function(){
      if (localStorage.getItem("golden_partner_token")){
        document.getElementById("shop-promo-title").textContent = "Gère ta boutique Golden";
        document.getElementById("shop-promo-sub").textContent = "Ajoute des produits, suis tes ventes et développe ta présence sur Golden.";
        const promoBtn = document.getElementById("shop-promo-btn");
        promoBtn.textContent = "Gérer ma boutique →";
        promoBtn.href = "espace-partenaire.html";
      }
      Promise.all([
        supaRequest("produits_golden?is_public=eq.true&order=created_at.desc"),
        supaRequest("partenaires_public_golden?first_validated=eq.true&select=business_name").catch(function(){ return []; })
      ]).then(function(results){
        const rows = results[0];
        verifiedShopNames = (results[1] || []).map(function(s){ return s.business_name; });
        const grid = document.getElementById("shop-grid");
        if (!rows || rows.length === 0){
          grid.innerHTML = '<p class="shop-empty">Aucun produit disponible pour le moment.</p>';
          return;
        }
        grid.innerHTML = rows.map(function(p, i){
          const thumb = (p.images && p.images[0]) ? p.images[0] : "";
          const hasDiscount = p.discount_percent && p.discount_percent > 0;
          const finalPrice = hasDiscount ? (p.price * (1 - p.discount_percent / 100)) : p.price;
          return '<div class="product-card">' +
            '<a href="product-detail.html?id=' + p.id + '" class="thumb">' +
              (hasDiscount ? '<span class="product-discount">-' + p.discount_percent + '%</span>' : '') +
              (thumb ? (isVideoUrl(thumb) ? '<video src="' + esc(thumb) + '" muted></video>' : '<img src="' + esc(thumb) + '" alt="' + esc(p.name) + '" loading="lazy">') : '') +
            '</a>' +
            '<button class="wishlist-heart" data-index="' + i + '" aria-label="Liste de souhaits">🤍</button>' +
            '<div class="product-info">' +
              '<a href="product-detail.html?id=' + p.id + '" class="product-name" style="text-decoration:none;color:inherit;display:block;">' + esc(p.name) + '</a>' +
              (p.partner_name ? '<a href="boutique-vendeur.html?nom=' + encodeURIComponent(p.partner_name) + '" class="product-boutique-badge">' + esc(p.partner_name) + (verifiedShopNames.indexOf(p.partner_name) !== -1 ? GOLDEN_VERIFIED_BADGE_SVG : '') + '</a><br>' : '') +
              (p.description ? '<div class="product-card-desc">' + esc(p.description.slice(0, 60)) + (p.description.length > 60 ? '…' : '') + '</div>' : '') +
              '<div class="product-price-row">' +
                '<span class="product-price">' + finalPrice.toFixed(2) + ' $</span>' +
                (hasDiscount ? '<span class="product-price-old">' + p.price.toFixed(2) + ' $</span>' : '') +
              '</div>' +
              '<button class="add-cart-btn" data-index="' + i + '">Ajouter au panier</button>' +
            '</div>' +
          '</div>';
        }).join("");

        grid.querySelectorAll(".add-cart-btn").forEach(function(btn){
          btn.addEventListener("click", function(){
            const p = rows[parseInt(btn.dataset.index, 10)];
            const thumb = (p.images && p.images[0]) ? p.images[0] : "";
            const hasDiscount = p.discount_percent && p.discount_percent > 0;
            const finalPrice = hasDiscount ? (p.price * (1 - p.discount_percent / 100)) : p.price;
            addToCart({ id: p.id, name: p.name, price: finalPrice, image: thumb }, 1);
            btn.textContent = "Ajouté ✓";
            btn.classList.add("added");
            setTimeout(function(){ btn.textContent = "Ajouter au panier"; btn.classList.remove("added"); }, 1500);
          });
        });

        grid.querySelectorAll(".wishlist-heart").forEach(function(btn){
          btn.addEventListener("click", function(){
            if (!isClientLoggedIn()){
              alert("Connecte-toi pour utiliser ta liste de souhaits.");
              window.location.href = "compte.html";
              return;
            }
            const p = rows[parseInt(btn.dataset.index, 10)];
            const active = btn.classList.contains("active");
            if (active){
              clientRequest("wishlist_golden?user_id=eq." + getClientSession().user.id + "&product_id=eq." + p.id, { method: "DELETE" })
                .then(function(){ btn.classList.remove("active"); btn.textContent = "🤍"; })
                .catch(function(err){ console.error(err); });
            } else {
              clientRequest("wishlist_golden", { method: "POST", body: { user_id: getClientSession().user.id, product_id: p.id } })
                .then(function(){ btn.classList.add("active"); btn.textContent = "❤️"; })
                .catch(function(err){ console.error(err); });
            }
          });
        });

        // Marque les cœurs déjà présents dans la liste de souhaits
        if (isClientLoggedIn()){
          clientRequest("wishlist_golden?user_id=eq." + getClientSession().user.id + "&select=product_id")
            .then(function(wishRows){
              const ids = (wishRows || []).map(function(w){ return w.product_id; });
              grid.querySelectorAll(".wishlist-heart").forEach(function(btn){
                const p = rows[parseInt(btn.dataset.index, 10)];
                if (ids.indexOf(p.id) !== -1){ btn.classList.add("active"); btn.textContent = "❤️"; }
              });
            })
            .catch(function(err){ console.error(err); });
        }
      }).catch(function(err){
        document.getElementById("shop-grid").innerHTML = '<p class="shop-empty">Boutique momentanément indisponible.</p>';
        console.error(err);
      });
    });
  </script>

</body>
</html>
