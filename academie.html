<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Académie — Agence Golden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260822f">
<style>
  .aca-wrap{max-width:900px;margin:0 auto;padding:64px 20px 90px;}
  .aca-wrap h1{font-size:26px;font-weight:600;text-align:center;margin-bottom:8px;}
  .aca-wrap > p.lead{text-align:center;color:var(--text-mute);margin-bottom:36px;font-size:14.5px;}
  .aca-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media (min-width:640px){.aca-grid{grid-template-columns:repeat(2,1fr);}}
  .aca-card{background:#fff;border:1px solid var(--stone-line);border-radius:12px;overflow:hidden;}
  .aca-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#EDEAE0;}
  .aca-card-body{padding:16px;}
  .aca-card-title{font-size:16px;font-weight:700;margin-bottom:4px;}
  .aca-card-meta{font-size:12px;color:var(--gold-dark,var(--gold));font-weight:600;margin-bottom:8px;}
  .aca-card-desc{font-size:13.5px;color:var(--text-mute);margin-bottom:12px;}
  .aca-card-price{font-size:15px;font-weight:700;margin-bottom:12px;}

  .aca-modal-overlay{position:fixed;inset:0;background:rgba(20,18,15,.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;}
  .aca-modal-box{background:#fff;border-radius:14px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;}
  .aca-modal-box h3{font-size:17px;margin-bottom:4px;}
  .aca-modal-box p.sub{font-size:12.5px;color:var(--text-mute);margin-bottom:16px;}
  .aca-modal-box label{display:block;font-size:12.5px;font-weight:600;margin:10px 0 4px;}
  .aca-modal-box input, .aca-modal-box select{width:100%;padding:9px 10px;border:1px solid var(--stone-line);border-radius:7px;font-size:13.5px;font-family:inherit;}
  .aca-modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-mute);}
  .aca-modal-box{position:relative;}
  .aca-modal-submit{width:100%;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:11px 0;font-size:13.5px;font-weight:700;margin-top:16px;cursor:pointer;}
  .aca-modal-status{font-size:12.5px;margin-top:10px;display:none;}
  .aca-access-link{display:block;background:#eef7ee;border:1px solid #bfe0bf;border-radius:8px;padding:12px;margin-top:10px;font-size:13px;word-break:break-all;color:var(--ink);text-decoration:underline;}
  .aca-btn-pending{background:#EDEAE0 !important;color:var(--text-mute) !important;cursor:default !important;}
  .aca-btn-open{background:#1a8f5e !important;color:#fff !important;text-decoration:none;display:block;width:100%;text-align:center;box-sizing:border-box;border:none;border-radius:8px;padding:11px 0;font-size:13.5px;font-weight:700;}
</style>
</head>
<body>

  <div id="site-header"></div>

  <section class="aca-wrap">
    <h1 data-i18n="academie_title">🎓 Golden Académie</h1>
    <p class="lead" data-i18n="academie_lead">Nos formations en ligne pour développer tes compétences avec Golden.</p>
    <div id="academie-grid" class="aca-grid"><p class="cm-empty">Chargement...</p></div>
  </section>

  <div id="site-footer"></div>

  <script src="translations.js?v=20260809"></script>
  <script src="script.js?v=20260913c"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function(){
      const grid = document.getElementById("academie-grid");
      let formationsById = {};
      supaRequest("formations_golden?is_public=eq.true&order=created_at.desc")
        .then(function(rows){
          if (!rows || rows.length === 0){
            grid.innerHTML = '<p class="cm-empty">Aucune formation publiée pour le moment.</p>';
            return;
          }
          rows.forEach(function(f){ formationsById[f.id] = f; });
          grid.innerHTML = rows.map(function(f){
            const title = pickLang(f, "title", "title");
            const desc = pickLang(f, "description", "desc");
            return '<div class="aca-card">' +
              (f.thumbnail_url ? '<img src="' + esc(f.thumbnail_url) + '" alt="' + esc(title) + '">' : '') +
              '<div class="aca-card-body">' +
                '<div class="aca-card-title">' + esc(title) + '</div>' +
                '<div class="aca-card-meta">' + (f.level ? esc(f.level) : "") + (f.level && f.duration ? " · " : "") + (f.duration ? esc(f.duration) : "") + '</div>' +
                (desc ? '<div class="aca-card-desc">' + esc(desc) + '</div>' : '') +
                (f.price ? '<div class="aca-card-price">' + (typeof f.price === "number" ? f.price.toFixed(2) + " $" : f.price) + '</div>' : '<div class="aca-card-price">Gratuit</div>') +
                '<button type="button" class="btn btn-onlight aca-signup-btn" data-id="' + f.id + '" style="display:block;width:100%;text-align:center;border:none;cursor:pointer;">S\'inscrire</button>' +
              '</div>' +
            '</div>';
          }).join("");

          grid.querySelectorAll(".aca-signup-btn").forEach(function(btn){
            btn.addEventListener("click", function(){
              openSignupModal(formationsById[btn.dataset.id]);
            });
          });

          checkExistingRegistrations(rows);
        })
        .catch(function(err){
          grid.innerHTML = '<p class="cm-empty">Formations momentanément indisponibles.</p>';
          console.error("Erreur académie :", err);
        });
    });

    // ============================================================
    // 💾 MÉMORISATION DE L'INSCRIPTION (localStorage) — permet au
    // visiteur de revenir sur la page et de voir directement l'état
    // de son inscription (en attente / accès disponible) sans avoir
    // besoin de l'e-mail, tant qu'il revient sur le même appareil.
    // ============================================================
    function checkExistingRegistrations(rows){
      rows.forEach(function(f){
        const savedId = localStorage.getItem("golden_aca_" + f.id);
        if (!savedId) return;
        supaRequest("rpc/get_formation_access", { method: "POST", body: { p_id: savedId } })
          .then(function(res){
            const row = res && res[0];
            if (!row || row.status === "annulée"){
              localStorage.removeItem("golden_aca_" + f.id);
              return;
            }
            updateButtonState(f.id, row.status, savedId);
          })
          .catch(function(err){ console.error("Erreur vérif inscription :", err); });
      });
    }

    function updateButtonState(formationId, status, inscriptionId){
      const btn = document.querySelector('.aca-signup-btn[data-id="' + formationId + '"]');
      if (!btn) return;
      if (status === "validée"){
        const link = document.createElement("a");
        link.href = "formation-acces.html?id=" + inscriptionId;
        link.className = "aca-btn-open";
        link.textContent = "▶️ Accéder à la formation";
        btn.replaceWith(link);
      } else if (status === "en attente de vérification"){
        btn.disabled = true;
        btn.classList.add("aca-btn-pending");
        btn.textContent = "⏳ En attente de validation";
      }
    }

    // ============================================================
    // 📧 ENVOI D'EMAIL — via l'Edge Function send-email-proxy (Brevo)
    // ============================================================
    const GOLDEN_ADMIN_EMAIL = "goldenbusinessone@gmail.com";
    const GOLDEN_SUPABASE_URL = "https://tmvkalnetmgcditrpenz.supabase.co";
    const GOLDEN_SUPABASE_KEY = "sb_publishable_jLjHM7CX2J7vSbIzTO0uSg_VECOhgLP";

    function sendGoldenEmail(to, toName, subject, html){
      return fetch(GOLDEN_SUPABASE_URL + "/functions/v1/send-email-proxy", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + GOLDEN_SUPABASE_KEY,
          "apikey": GOLDEN_SUPABASE_KEY
        },
        body: JSON.stringify({ to: to, toName: toName, subject: subject, html: html })
      }).then(function(res){ return res.json(); })
        .catch(function(err){ console.error("Erreur envoi email :", err); });
    }

    // ============================================================
    // 📝 INSCRIPTION À UNE FORMATION — formulaire sur le site,
    // plus de redirection vers WhatsApp. Gratuit = validé et accès
    // envoyé immédiatement ; payant = en attente de vérification
    // manuelle par l'admin (comme pour les commandes).
    // ============================================================
    function openSignupModal(formation){
      const isPaid = typeof formation.price === "number" && formation.price > 0;
      const title = pickLang(formation, "title", "title");

      const overlay = document.createElement("div");
      overlay.className = "aca-modal-overlay";
      overlay.id = "aca-modal-overlay";
      overlay.onclick = function(e){ if (e.target === overlay) overlay.remove(); };
      overlay.innerHTML =
        '<div class="aca-modal-box">' +
          '<button type="button" class="aca-modal-close" onclick="document.getElementById(\'aca-modal-overlay\').remove()">✕</button>' +
          '<h3>Inscription — ' + esc(title) + '</h3>' +
          '<p class="sub">' + (isPaid ? "Formation payante (" + formation.price.toFixed(2) + " $) — indique ta référence de paiement, on valide et t'envoie l'accès par email." : "Formation gratuite — tu reçois l'accès par email juste après.") + '</p>' +
          '<label>Nom complet</label><input type="text" id="aca-name" required>' +
          '<label>E-mail</label><input type="email" id="aca-email" required>' +
          '<label>Téléphone</label><input type="tel" id="aca-phone" required>' +
          '<label>Région</label><input type="text" id="aca-region">' +
          '<label>Pays</label><input type="text" id="aca-country">' +
          (isPaid ?
            '<label>Moyen de paiement</label><select id="aca-method">' + GOLDEN_PAYMENT_METHODS.map(function(m){ return '<option value="' + esc(m.name) + '">' + esc(m.name) + ' — ' + esc(m.number) + '</option>'; }).join("") + '</select>' +
            '<label>Référence / numéro de transaction</label><input type="text" id="aca-txid" required>'
          : '') +
          '<button type="button" class="aca-modal-submit" id="aca-submit-btn">S\'inscrire</button>' +
          '<p class="aca-modal-status" id="aca-modal-status"></p>' +
        '</div>';
      document.body.appendChild(overlay);

      document.getElementById("aca-submit-btn").addEventListener("click", function(){
        const name = document.getElementById("aca-name").value.trim();
        const email = document.getElementById("aca-email").value.trim();
        const phone = document.getElementById("aca-phone").value.trim();
        const region = document.getElementById("aca-region").value.trim();
        const country = document.getElementById("aca-country").value.trim();
        const status = document.getElementById("aca-modal-status");
        const btn = document.getElementById("aca-submit-btn");

        if (!name || !email || !phone){
          status.style.display = "block"; status.style.color = "#c85a5a";
          status.textContent = "Nom, e-mail et téléphone sont obligatoires.";
          return;
        }
        let txid = "", method = "";
        if (isPaid){
          txid = document.getElementById("aca-txid").value.trim();
          method = document.getElementById("aca-method").value;
          if (!txid){
            status.style.display = "block"; status.style.color = "#c85a5a";
            status.textContent = "La référence de paiement est obligatoire pour une formation payante.";
            return;
          }
        }

        btn.disabled = true;
        status.style.display = "block"; status.style.color = "var(--gold)";
        status.textContent = "Envoi en cours...";

        getVisitorIp().then(function(ip){
          const body = {
            formation_id: formation.id, full_name: name, email: email, phone: phone,
            region: region || null, country: country || null,
            status: isPaid ? "en attente de vérification" : "validée",
            user_agent: navigator.userAgent
          };
          if (ip) body.ip_address = ip;
          if (isPaid){ body.transaction_id = txid; body.method = method; }
          return supaRequest("inscriptions_formation_golden", { method: "POST", body: body });
        }).then(function(rows){
          const inscription = rows && rows[0];

          // Mémorise cette inscription sur cet appareil + met à jour le bouton
          localStorage.setItem("golden_aca_" + formation.id, inscription.id);
          updateButtonState(formation.id, isPaid ? "en attente de vérification" : "validée", inscription.id);

          // --- Email de notification à l'admin (systématique) ---
          const adminHtml =
            "<h2>Nouvelle inscription — " + esc(title) + "</h2>" +
            "<p><b>Nom :</b> " + esc(name) + "<br>" +
            "<b>E-mail :</b> " + esc(email) + "<br>" +
            "<b>Téléphone :</b> " + esc(phone) + "<br>" +
            (region ? "<b>Région :</b> " + esc(region) + "<br>" : "") +
            (country ? "<b>Pays :</b> " + esc(country) + "<br>" : "") +
            "<b>Statut :</b> " + (isPaid ? "Payante — en attente de vérification" : "Gratuite — validée") +
            (isPaid ? "<br><b>Méthode :</b> " + esc(method) + "<br><b>Référence :</b> " + esc(txid) : "") + "</p>";
          sendGoldenEmail(GOLDEN_ADMIN_EMAIL, "Golden Admin", "🎓 Nouvelle inscription Académie — " + title, adminHtml);

          if (isPaid){
            status.style.color = "#1a8f5e";
            status.textContent = "✅ Inscription reçue ! On vérifie ton paiement et t'envoie l'accès par e-mail sous peu.";
          } else {
            const accessUrl = location.origin + location.pathname.replace(/academie\.html$/, "") + "formation-acces.html?id=" + inscription.id;
            status.innerHTML = "✅ Inscription confirmée ! Ton accès :<br><a class=\"aca-access-link\" href=\"" + accessUrl + "\">" + accessUrl + "</a><br><span style=\"font-size:11.5px;color:var(--text-mute);\">(envoyé aussi par e-mail)</span>";

            // --- Email d'accès au client (formation gratuite uniquement) ---
            const clientHtml =
              "<h2>Bienvenue dans la formation " + esc(title) + " !</h2>" +
              "<p>Bonjour " + esc(name) + ",</p>" +
              "<p>Ton inscription est confirmée. Voici ton accès :</p>" +
              "<p><a href=\"" + accessUrl + "\">" + accessUrl + "</a></p>" +
              "<p>À bientôt,<br>L'équipe Golden</p>";
            sendGoldenEmail(email, name, "🎓 Ton accès — " + title, clientHtml);
          }

          document.getElementById("aca-name").disabled = true;
          document.getElementById("aca-email").disabled = true;
          document.getElementById("aca-phone").disabled = true;
          btn.style.display = "none";
        }).catch(function(err){
          status.style.color = "#c85a5a";
          status.textContent = "❌ " + err.message;
          btn.disabled = false;
        });
      });
    }
  </script>

</body>
</html>
