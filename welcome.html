<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenue — Agence Golden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260813">
<style>
  html,body{height:100%;}
  .welcome-screen{min-height:100vh;background:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;}
  .welcome-bg{position:absolute;inset:0;opacity:.16;overflow:hidden;}
  .welcome-bg-row{display:flex;gap:40px;white-space:nowrap;font-size:64px;animation:welcomeScroll 22s linear infinite;}
  .welcome-bg-row:nth-child(2){animation-duration:28s;animation-direction:reverse;margin-top:60px;}
  .welcome-bg-row:nth-child(3){animation-duration:25s;margin-top:60px;}
  @keyframes welcomeScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .welcome-content{position:relative;z-index:2;padding:40px 28px 56px;text-align:center;}
  .welcome-logo{font-family:'Fraunces',serif;color:var(--gold);font-size:36px;font-weight:700;margin-bottom:6px;}
  .welcome-tagline{color:#c9c4b6;font-size:14px;margin-bottom:40px;}
  .welcome-btn{display:block;width:100%;max-width:340px;margin:0 auto 12px;padding:15px 0;border-radius:30px;font-size:14.5px;font-weight:700;text-decoration:none;text-align:center;cursor:pointer;border:none;}
  .welcome-btn.primary{background:var(--gold);color:var(--ink);}
  .welcome-btn.secondary{background:transparent;color:#fff;border:1px solid #4a4636;}
  .welcome-skip{display:block;margin-top:20px;color:#a39d8a;font-size:13px;text-decoration:none;}
</style>
</head>
<body>

  <div class="welcome-screen">
    <div class="welcome-bg">
      <div class="welcome-bg-row">🎧📷🎤📱💻🎬🖥️🎧📷🎤📱💻🎬🖥️</div>
      <div class="welcome-bg-row">🎨📢🛠️🎥📊🎧📷🎨📢🛠️🎥📊🎧📷</div>
      <div class="welcome-bg-row">🎉🍽️🔧💼🎁🎧🎨🎉🍽️🔧💼🎁🎧🎨</div>
    </div>
    <div class="welcome-content">
      <div class="welcome-logo">GOLDEN</div>
      <p class="welcome-tagline">Événementiel · Promotion · Média & Digital · Services Techniques</p>

      <a class="welcome-btn primary" href="compte.html?tab=signup">Créer un compte</a>
      <a class="welcome-btn secondary" href="compte.html?tab=login">Se connecter</a>
      <a class="welcome-skip" href="index.html" id="skip-link">Continuer sans se connecter →</a>
    </div>
  </div>

  <script src="script.js?v=20260813"></script>
  <script>
    // Si déjà connecté, inutile de repasser par cet écran
    if (typeof isClientLoggedIn === "function" && isClientLoggedIn()){
      window.location.href = "index.html";
    }
    document.getElementById("skip-link").addEventListener("click", function(){
      sessionStorage.setItem("golden_splash_seen", "1");
    });
    document.querySelectorAll('.welcome-btn').forEach(function(a){
      a.addEventListener("click", function(){ sessionStorage.setItem("golden_splash_seen", "1"); });
    });
  </script>

</body>
</html>
