<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Administration - Agence Golden</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260809">
  <style>
    /* Styles inchangés mais nettoyés */
    .admin-wrap{max-width:560px;margin:0 auto;padding:70px 24px 100px;}
    .admin-lock{text-align:center;padding-top:40px;}
    .admin-lock input{width:100%;max-width:280px;padding:12px;border:1px solid var(--stone-line);border-radius:6px;margin:8px 0;font-size:15px;}
    #admin-panel{display:none;}
    .admin-wrap h1{font-size:24px;text-align:center;margin-bottom:30px;}
    .admin-box{background:#fff;border:1px solid var(--stone-line);border-radius:10px;padding:22px;margin-bottom:24px;}
    .admin-box label{display:block;font-size:12.5px;font-weight:600;color:var(--text-mute);margin:12px 0 6px;}
    .admin-box input,.admin-box select,.admin-box textarea{width:100%;border:1px solid var(--stone-line);border-radius:6px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;}
    .admin-box textarea{min-height:70px;resize:vertical;}
    .upload-status{font-size:12.5px;color:var(--gold);margin-top:10px;display:none;}
    .admin-list-item{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--stone-line);padding:10px 0;}
    .admin-list-item img{width:52px;height:52px;object-fit:cover;border-radius:6px;flex:0 0 auto;}
    .admin-list-item .info{flex:1;font-size:12.5px;}
    .admin-list-item .info b{display:block;font-size:13.5px;color:var(--ink);}
    .admin-list-item button{background:none;border:1px solid #c85a5a;color:#c85a5a;border-radius:4px;padding:5px 10px;font-size:11px;cursor:pointer;}
    #auth-error{color:#c85a5a;font-size:13px;display:none;margin-top:8px;}
    #btn-signin:disabled{opacity:.5;}
    .logout-link{display:block;text-align:right;font-size:12px;color:var(--text-mute);margin-bottom:16px;cursor:pointer;}
  </style>

  <!-- Firebase compat libs (comme dans ton projet) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <div class="admin-wrap">
    <div class="admin-lock" id="auth-card">
      <h1>☒ Espace administrateur</h1>
      <p style="color:var(--text-mute);font-size:14px;">Connecte-toi avec ton compte admin pour publier une réalisation.</p>

      <input type="email" id="admin-email" placeholder="E-mail">
      <br>
      <input type="password" id="admin-pass" placeholder="Mot de passe">
      <br>
      <button class="btn btn-onlight" id="btn-signin" onclick="adminSignIn()">Se connecter</button>
      <p id="auth-error"></p>
    </div>

    <div id="admin-panel">
      <div class="logout-link" onclick="auth.signOut()">Se déconnecter</div>
      <h1>Publier une réalisation</h1>

      <div class="admin-box">
        <label>Zone concernée</label>
        <select id="ad-zone">
          <option value="ZONE A">Événementiel (ZONE A)</option>
          <option value="ZONE B">Promotion Commerciale (ZONE B)</option>
          <option value="ZONE C">Média &amp; Digital (ZONE C)</option>
          <option value="ZONE D">Services Techniques (ZONE D)</option>
        </select>

        <label>Titre</label>
        <input type="text" id="ad-title" placeholder="Ex : Mariage Kavumu - Juin 2026">

        <label>Description</label>
        <textarea id="ad-desc" placeholder="Décrivez la réalisation, le client, le contexte ..."></textarea>

        <label>Lien (site du partenaire, page Facebook, etc. - optionnel)</label>
        <input type="url" id="ad-link" placeholder="https:// ... ">

        <label>Photo ou vidéo (depuis votre téléphone) - laissez vide si vous mettez un lien YouTube ci-dessous</label>
        <input type="file" id="ad-file" accept="image/*,video/*">

        <label>Vidéo YouTube (optionnel - collez le lien après l'avoir mise en ligne sur votre chaîne)</label>
        <input type="url" id="ad-video" placeholder="https://youtube.com/watch?v=...">

        <button class="btn btn-onlight" id="btn-publish" style="margin-top:16px;" onclick="publishRealisation()">Publier</button>
        <p class="upload-status" id="upload-status"></p>
      </div>

      <div class="admin-box">
        <h2 style="font-size:15px;margin-bottom:10px;">Publier un podcast (Média &amp; Digital uniquement)</h2>
        <label>Titre de l'épisode</label>
        <input type="text" id="pc-title" placeholder="Ex : Épisode 1 - Comment lancer son business">
        <label>Description</label>
        <textarea id="pc-desc" placeholder="Résumé de l'épisode ... "></textarea>
        <label>Lien de l'épisode (Spotify, YouTube, SoundCloud ... )</label>
        <input type="url" id="pc-link" placeholder="https://open.spotify.com/episode/...">
        <label>Ou fichier audio (MP3, depuis votre téléphone)</label>
        <input type="file" id="pc-audio" accept="audio/*">
        <button class="btn btn-onlight" id="btn-publish-podcast" style="margin-top:16px;" onclick="publishPodcast()">Publier le podcast</button>
        <p class="upload-status" id="podcast-status"></p>
      </div>

      <div class="admin-box">
        <h2 style="font-size:15px;margin-bottom:10px;">Podcasts publiés</h2>
        <div id="podcast-admin-list"></div>
      </div>

      <div class="admin-box">
        <h2 style="font-size:15px;margin-bottom:10px;">Réalisations publiées</h2>
        <div id="admin-list"></div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="translations.js?v=20260809"></script>
  <script src="script.js?v=20260809"></script>

  <script>
    // Fonctions d'interface simples (statut)
    function showStatus(text, isError){
      const status = document.getElementById("upload-status");
      if (!status) return;
      status.style.display = "block";
      status.style.color = isError ? "#c85a5a" : "var(--gold)";
      status.textContent = text;
    }
    function clearStatus(){
      const status = document.getElementById("upload-status");
      if (!status) return;
      status.style.display = "none";
    }

    // Les fonctions d'admin (signIn, publish...) sont définies dans script.js
    // Ce fichier HTML appelle les fonctions globales exposées par script.js
  </script>
</body>
    </html>
