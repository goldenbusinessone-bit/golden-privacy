<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon compte — Agence Golden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260812">
<style>
  .account-wrap{max-width:480px;margin:0 auto;padding:70px 24px 100px;}
  .account-wrap h1{font-size:24px;text-align:center;margin-bottom:8px;}
  .account-wrap > p.lead{text-align:center;color:var(--text-mute);font-size:14px;margin-bottom:30px;}
  .account-box{background:#fff;border:1px solid var(--stone-line);border-radius:10px;padding:24px;margin-bottom:20px;}
  .account-box label{display:block;font-size:12.5px;font-weight:600;color:var(--text-mute);margin:12px 0 6px;}
  .account-box input{width:100%;border:1px solid var(--stone-line);border-radius:6px;padding:11px 13px;font-family:'Inter',sans-serif;font-size:14px;}
  .tabs{display:flex;gap:6px;margin-bottom:18px;background:#f2efe6;border-radius:20px;padding:4px;}
  .tab-btn{flex:1;background:none;border:none;padding:9px 0;border-radius:16px;font-size:13px;font-weight:600;color:var(--text-mute);cursor:pointer;}
  .tab-btn.active{background:#fff;color:var(--ink);}
  #form-error{color:#c85a5a;font-size:13px;display:none;margin-top:10px;}
  #form-success{color:#3f7a34;font-size:13px;display:none;margin-top:10px;}
  .profile-view{display:none;text-align:center;}
  .profile-avatar-big{width:84px;height:84px;border-radius:50%;object-fit:cover;margin:0 auto 14px;display:block;background:var(--stone);}
  .profile-avatar-fallback{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:var(--gold);color:var(--ink);font-size:30px;font-weight:700;}
  .profile-view h2{font-size:19px;margin-bottom:4px;}
  .profile-view .email{color:var(--text-mute);font-size:13px;margin-bottom:20px;}
  .logout-link{display:block;text-align:center;font-size:12.5px;color:var(--text-mute);margin-top:16px;cursor:pointer;}
</style>
</head>
<body>

  <div id="site-header"></div>

  <div class="account-wrap">
    <h1>👤 Mon compte</h1>
    <p class="lead">Connecte-toi pour commander, demander un devis et suivre tes échanges avec Golden.</p>

    <div class="account-box" id="auth-box">
      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Se connecter</button>
        <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Créer un compte</button>
      </div>

      <div id="pane-login">
        <label>E-mail</label>
        <input type="email" id="li-email" placeholder="ton@email.com">
        <label>Mot de passe</label>
        <input type="password" id="li-pass" placeholder="••••••••">
        <button class="btn btn-onlight" style="margin-top:18px;width:100%;justify-content:center;" onclick="doLogin()">Se connecter</button>
      </div>

      <div id="pane-signup" style="display:none;">
        <label>Nom complet</label>
        <input type="text" id="su-name" placeholder="Ton nom">
        <label>E-mail</label>
        <input type="email" id="su-email" placeholder="ton@email.com">
        <label>Mot de passe</label>
        <input type="password" id="su-pass" placeholder="6 caractères minimum">
        <button class="btn btn-onlight" style="margin-top:18px;width:100%;justify-content:center;" onclick="doSignup()">Créer mon compte</button>
      </div>

      <p id="form-error"></p>
      <p id="form-success"></p>
    </div>

    <div class="account-box profile-view" id="profile-box">
      <img class="profile-avatar-big" id="pv-avatar-img" style="display:none;" alt="">
      <div class="profile-avatar-fallback" id="pv-avatar-fallback" style="display:none;"></div>
      <h2 id="pv-name"></h2>
      <p class="email" id="pv-email"></p>

      <label style="text-align:left;">Modifier mon nom</label>
      <input type="text" id="pv-name-input">

      <label style="text-align:left;">Changer ma photo de profil</label>
      <input type="file" id="pv-avatar-input" accept="image/*">

      <button class="btn btn-onlight" style="margin-top:18px;width:100%;justify-content:center;" onclick="saveProfileEdits()">Enregistrer</button>
      <p id="profile-status" style="font-size:12.5px;color:var(--gold);margin-top:10px;display:none;"></p>

      <div class="logout-link" onclick="doLogout()">Se déconnecter</div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="translations.js?v=20260809"></script>
  <script src="script.js?v=20260812"></script>
  <script>
    function switchTab(tab){
      document.getElementById("tab-login").classList.toggle("active", tab === "login");
      document.getElementById("tab-signup").classList.toggle("active", tab === "signup");
      document.getElementById("pane-login").style.display = tab === "login" ? "block" : "none";
      document.getElementById("pane-signup").style.display = tab === "signup" ? "block" : "none";
      hideMessages();
    }

    function hideMessages(){
      document.getElementById("form-error").style.display = "none";
      document.getElementById("form-success").style.display = "none";
    }
    function showError(msg){
      const err = document.getElementById("form-error");
      err.textContent = msg;
      err.style.display = "block";
    }

    function doLogin(){
      hideMessages();
      const email = document.getElementById("li-email").value.trim();
      const pass = document.getElementById("li-pass").value;
      if (!email || !pass){ showError("E-mail et mot de passe requis."); return; }
      clientSignIn(email, pass).then(function(){
        window.location.href = "index.html";
      }).catch(function(e){ showError(e.message); });
    }

    function doSignup(){
      hideMessages();
      const name = document.getElementById("su-name").value.trim();
      const email = document.getElementById("su-email").value.trim();
      const pass = document.getElementById("su-pass").value;
      if (!name || !email || !pass){ showError("Tous les champs sont requis."); return; }
      if (pass.length < 6){ showError("Le mot de passe doit faire au moins 6 caractères."); return; }
      clientSignUp(email, pass, name).then(function(data){
        if (isClientLoggedIn()){
          window.location.href = "index.html";
        } else {
          const ok = document.getElementById("form-success");
          ok.textContent = "Compte créé ! Vérifie ta boîte e-mail pour confirmer, puis connecte-toi.";
          ok.style.display = "block";
          switchTab("login");
        }
      }).catch(function(e){ showError(e.message); });
    }

    function doLogout(){
      clientSignOut();
      window.location.href = "index.html";
    }

    function showProfile(){
      document.getElementById("auth-box").style.display = "none";
      document.getElementById("profile-box").style.display = "block";
      const session = getClientSession();
      document.getElementById("pv-email").textContent = session.user.email;
      loadOwnProfile().then(function(profile){
        const name = (profile && profile.full_name) ? profile.full_name : session.user.email;
        document.getElementById("pv-name").textContent = name;
        document.getElementById("pv-name-input").value = name;
        const avatarImg = document.getElementById("pv-avatar-img");
        const avatarFallback = document.getElementById("pv-avatar-fallback");
        if (profile && profile.avatar_url){
          avatarImg.src = profile.avatar_url;
          avatarImg.style.display = "block";
          avatarFallback.style.display = "none";
        } else {
          avatarFallback.textContent = name.trim().charAt(0).toUpperCase();
          avatarFallback.style.display = "flex";
          avatarImg.style.display = "none";
        }
      });
      renderAccountWidget();
    }

    function saveProfileEdits(){
      const name = document.getElementById("pv-name-input").value.trim();
      const fileInput = document.getElementById("pv-avatar-input");
      const file = fileInput.files[0];
      const status = document.getElementById("profile-status");
      status.style.display = "block";
      status.style.color = "var(--gold)";
      status.textContent = "Enregistrement...";

      const uploadStep = file ? uploadToSupabase(file, "avatars") : Promise.resolve(null);

      uploadStep.then(function(avatarUrl){
        return saveOwnProfile(name, avatarUrl);
      }).then(function(){
        status.textContent = "✅ Profil mis à jour !";
        fileInput.value = "";
        showProfile();
        setTimeout(function(){ status.style.display = "none"; }, 2500);
      }).catch(function(e){
        status.style.color = "#c85a5a";
        status.textContent = "❌ " + e.message;
      });
    }

    // Si déjà connecté, on affiche directement le profil
    if (isClientLoggedIn()) showProfile();
  </script>

</body>
</html>
