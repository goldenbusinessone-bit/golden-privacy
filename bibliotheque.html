<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliothèque — Agence Golden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260822f">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
  .lib-wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px;}
  .lib-toolbar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    background:#fff;border:1px solid var(--stone-line);border-radius:10px;padding:12px;margin-bottom:14px;
  }
  .lib-toolbar button{
    background:#fff;border:1px solid var(--stone-line);border-radius:6px;padding:8px 12px;
    font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);
  }
  .lib-toolbar button:hover{background:var(--gold);border-color:var(--gold);}
  .lib-toolbar button.danger{color:#c85a5a;border-color:#dcb2b2;}
  .lib-toolbar input[type=color]{width:36px;height:36px;border:1px solid var(--stone-line);border-radius:6px;padding:2px;cursor:pointer;}
  .lib-toolbar input[type=range]{width:100px;}
  .lib-toolbar label{font-size:12px;color:var(--text-mute);display:flex;align-items:center;gap:6px;}
  .lib-canvas-area{background:#EDEAE0;border-radius:12px;padding:24px;display:flex;justify-content:center;overflow:auto;}
  .lib-canvas-area canvas{box-shadow:0 10px 30px rgba(0,0,0,.15);}
  .lib-save-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center;}
  .lib-save-row input[type=text]{flex:1;min-width:160px;border:1px solid var(--stone-line);border-radius:6px;padding:10px 12px;font-size:14px;}
  .lib-status{font-size:12.5px;color:var(--gold);margin-left:6px;}
  .lib-login-gate{background:#FAF6EA;border:1px dashed var(--stone-line);border-radius:10px;padding:26px 22px;text-align:center;margin-bottom:20px;}
  .my-creations-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:30px;}
  @media (min-width:640px){.my-creations-grid{grid-template-columns:repeat(4,1fr);}}
  .creation-card{background:#fff;border:1px solid var(--stone-line);border-radius:10px;overflow:hidden;cursor:pointer;}
  .creation-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#EDEAE0;}
  .creation-card .cc-title{padding:8px 10px;font-size:12.5px;font-weight:600;}
</style>
</head>
<body>

  <div id="site-header"></div>

  <section class="lib-wrap">
    <h1 style="font-size:24px;font-weight:600;text-align:center;margin-bottom:6px;">📚 Bibliothèque Golden</h1>
    <p style="text-align:center;color:var(--text-mute);font-size:14px;margin-bottom:24px;">Crée ton affiche, ton design, ta création — comme tu veux.</p>

    <div class="lib-login-gate" id="login-gate">
      <p style="color:var(--text-mute);margin-bottom:16px;">🔒 Connecte-toi à ton compte Golden pour créer et sauvegarder tes designs.</p>
      <a href="compte.html" class="btn btn-onlight">Se connecter</a>
    </div>

    <div id="editor-area" style="display:none;">
      <div class="lib-toolbar">
        <button type="button" id="add-text">🔤 Texte</button>
        <button type="button" id="add-rect">▭ Rectangle</button>
        <button type="button" id="add-circle">● Cercle</button>
        <button type="button" id="add-image-btn">🖼️ Image</button>
        <input type="file" id="add-image-input" accept="image/*" style="display:none;">
        <label>Couleur <input type="color" id="color-picker" value="#C9A227"></label>
        <label>Taille <input type="range" id="size-slider" min="10" max="120" value="28"></label>
        <button type="button" id="bring-front">⬆️ Avant</button>
        <button type="button" id="send-back">⬇️ Arrière</button>
        <button type="button" id="delete-obj" class="danger">🗑️ Supprimer</button>
        <button type="button" id="clear-canvas" class="danger">✖️ Tout effacer</button>
      </div>

      <div class="lib-canvas-area">
        <canvas id="lib-canvas" width="600" height="800"></canvas>
      </div>

      <div class="lib-save-row">
        <input type="text" id="creation-title" placeholder="Titre de ta création (ex : Affiche promo été)">
        <button type="button" class="btn btn-onlight" id="save-btn">💾 Sauvegarder</button>
        <button type="button" class="btn btn-onlight" id="export-btn" style="background:#fff;color:var(--ink);border:1px solid var(--stone-line);">⬇️ Télécharger en image</button>
        <span class="lib-status" id="lib-status" style="display:none;"></span>
      </div>

      <h2 style="font-size:16px;margin-top:36px;margin-bottom:6px;">🗂️ Mes créations</h2>
      <div class="my-creations-grid" id="my-creations-grid"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="translations.js?v=20260809"></script>
  <script src="script.js?v=20260822e"></script>
  <script>
    let libCanvas = null;
    let currentCreationId = null;

    document.addEventListener("DOMContentLoaded", function(){
      if (!isClientLoggedIn()){
        document.getElementById("login-gate").style.display = "block";
        document.getElementById("editor-area").style.display = "none";
        return;
      }
      document.getElementById("login-gate").style.display = "none";
      document.getElementById("editor-area").style.display = "block";
      initEditor();
    });

    function initEditor(){
      libCanvas = new fabric.Canvas("lib-canvas", { backgroundColor: "#ffffff" });

      document.getElementById("add-text").addEventListener("click", function(){
        const size = parseInt(document.getElementById("size-slider").value, 10);
        const color = document.getElementById("color-picker").value;
        const text = new fabric.IText("Ton texte ici", { left: 80, top: 80, fontSize: size, fill: color, fontFamily: "Inter, Arial, sans-serif" });
        libCanvas.add(text).setActiveObject(text);
      });

      document.getElementById("add-rect").addEventListener("click", function(){
        const color = document.getElementById("color-picker").value;
        const rect = new fabric.Rect({ left: 100, top: 100, width: 140, height: 100, fill: color });
        libCanvas.add(rect).setActiveObject(rect);
      });

      document.getElementById("add-circle").addEventListener("click", function(){
        const color = document.getElementById("color-picker").value;
        const circle = new fabric.Circle({ left: 100, top: 100, radius: 60, fill: color });
        libCanvas.add(circle).setActiveObject(circle);
      });

      document.getElementById("add-image-btn").addEventListener("click", function(){
        document.getElementById("add-image-input").click();
      });
      document.getElementById("add-image-input").addEventListener("change", function(e){
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev){
          fabric.Image.fromURL(ev.target.result, function(img){
            img.scaleToWidth(220);
            img.set({ left: 60, top: 60 });
            libCanvas.add(img).setActiveObject(img);
          });
        };
        reader.readAsDataURL(file);
        e.target.value = "";
      });

      document.getElementById("color-picker").addEventListener("input", function(){
        const obj = libCanvas.getActiveObject();
        if (obj){ obj.set("fill", this.value); libCanvas.requestRenderAll(); }
      });
      document.getElementById("size-slider").addEventListener("input", function(){
        const obj = libCanvas.getActiveObject();
        if (obj && obj.type === "i-text"){ obj.set("fontSize", parseInt(this.value, 10)); libCanvas.requestRenderAll(); }
      });

      document.getElementById("bring-front").addEventListener("click", function(){
        const obj = libCanvas.getActiveObject();
        if (obj) libCanvas.bringToFront(obj);
      });
      document.getElementById("send-back").addEventListener("click", function(){
        const obj = libCanvas.getActiveObject();
        if (obj) libCanvas.sendToBack(obj);
      });
      document.getElementById("delete-obj").addEventListener("click", function(){
        const obj = libCanvas.getActiveObject();
        if (obj) libCanvas.remove(obj);
      });
      document.getElementById("clear-canvas").addEventListener("click", function(){
        if (confirm("Effacer toute la création en cours ?")){
          libCanvas.clear();
          libCanvas.backgroundColor = "#ffffff";
          libCanvas.requestRenderAll();
        }
      });

      document.getElementById("export-btn").addEventListener("click", function(){
        const dataUrl = libCanvas.toDataURL({ format: "png", quality: 1 });
        const a = document.createElement("a");
        a.href = dataUrl;
        a.download = (document.getElementById("creation-title").value.trim() || "creation-golden") + ".png";
        a.click();
      });

      document.getElementById("save-btn").addEventListener("click", saveCreation);

      // Reprend une création existante si ?id= est présent dans l'URL
      const params = new URLSearchParams(window.location.search);
      const editId = params.get("id");
      if (editId) loadCreation(editId);

      loadMyCreations();
    }

    function saveCreation(){
      const status = document.getElementById("lib-status");
      const title = document.getElementById("creation-title").value.trim() || "Sans titre";
      const session = getClientSession();
      status.style.display = "inline";
      status.style.color = "var(--gold)";
      status.textContent = "Sauvegarde...";

      const canvasJson = libCanvas.toJSON();
      const thumbDataUrl = libCanvas.toDataURL({ format: "png", quality: 0.8, multiplier: 0.5 });

      fetch(thumbDataUrl).then(function(r){ return r.blob(); }).then(function(blob){
        const file = new File([blob], "thumb-" + Date.now() + ".png", { type: "image/png" });
        return uploadToSupabase(file, "creations");
      }).then(function(thumbUrl){
        const body = { user_id: session.user.id, title: title, thumbnail_url: thumbUrl, canvas_json: canvasJson, updated_at: new Date().toISOString() };
        if (currentCreationId){
          return clientRequest("user_creations_golden?id=eq." + currentCreationId, { method: "PATCH", body: body });
        }
        return clientRequest("user_creations_golden", { method: "POST", body: body }).then(function(rows){
          if (rows && rows[0]) currentCreationId = rows[0].id;
        });
      }).then(function(){
        status.textContent = "✅ Sauvegardé !";
        loadMyCreations();
        setTimeout(function(){ status.style.display = "none"; }, 2500);
      }).catch(function(err){
        status.style.color = "#c85a5a";
        status.textContent = "❌ " + err.message;
        console.error(err);
      });
    }

    function loadCreation(id){
      clientRequest("user_creations_golden?id=eq." + id + "&select=*").then(function(rows){
        if (!rows || !rows[0]) return;
        const c = rows[0];
        currentCreationId = c.id;
        document.getElementById("creation-title").value = c.title || "";
        libCanvas.loadFromJSON(c.canvas_json, function(){ libCanvas.requestRenderAll(); });
      }).catch(function(err){ console.error("Erreur chargement création :", err); });
    }

    function loadMyCreations(){
      const grid = document.getElementById("my-creations-grid");
      clientRequest("user_creations_golden?select=id,title,thumbnail_url&order=updated_at.desc&limit=20")
        .then(function(rows){
          if (!rows || rows.length === 0){
            grid.innerHTML = '<p class="cm-empty">Aucune création pour le moment.</p>';
            return;
          }
          grid.innerHTML = rows.map(function(c){
            return '<div class="creation-card" onclick="window.location.href=\'bibliotheque.html?id=' + c.id + '\'">' +
              (c.thumbnail_url ? '<img src="' + esc(c.thumbnail_url) + '">' : '<div style="aspect-ratio:1/1;background:#EDEAE0;"></div>') +
              '<div class="cc-title">' + esc(c.title || "Sans titre") + '</div>' +
            '</div>';
          }).join("");
        })
        .catch(function(err){ console.error("Erreur liste créations :", err); });
    }
  </script>

</body>
</html>
